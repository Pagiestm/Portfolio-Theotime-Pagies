# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Revue de code automatique CodeRabbit - gratuit sur les repos publics.
language: fr-FR

reviews:
  # « chill » = revue posée qui ne bloque pas la PR (pas de "request changes").
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  poem: false
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - master
      - develop
  # On ne relit ni les artefacts de build ni les fichiers générés.
  path_filters:
    - '!**/dist/**'
    - '!**/*.min.*'
    - '!package-lock.json'
    - '!CHANGELOG.md'
  path_instructions:
    - path: 'apps/web/src/**/*.{ts,tsx}'
      instructions: >-
        Site React 19 + TypeScript + Vite, design « Modernist » : aucun arrondi,
        et toute couleur vient des tokens. Tailwind 4 - ils sont déclarés dans un
        bloc `@theme` de styles/tokens.css, il n'existe aucun tailwind.config.js ;
        signale toute couleur écrite en dur. Architecture feature-based :
        UI → hooks → services → API. Vérifie qu'aucun composant n'appelle une API
        directement, qu'aucune feature n'importe une autre feature, que
        `import.meta.env` n'apparaît que dans config/env.ts, et que les textes
        passent par `localize()`. Signale bugs, accessibilité (dont
        prefers-reduced-motion), performance et fuites (observateurs, WebGL -
        three.js exige `forceContextLoss()` au démontage, et les textures ne sont
        pas libérées par `scene.traverse`).
    - path: 'apps/studio/**/*.ts'
      instructions: >-
        Schémas Sanity du back-office. Vérifie que chaque champ éditorial a un
        `title` et une `description` compréhensibles par un non-développeur, que
        les champs indispensables au rendu du site sont `required()`, et que les
        champs projetés par apps/web/src/services/sanity/queries.ts existent bien
        dans les schémas. Les identifiants de documents ne doivent jamais
        contenir de point.
    - path: 'apps/api/**/*.ts'
      instructions: >-
        API Hono déployée en fonction Vercel, en couches routes → contrôleurs →
        services → modèles : une couche ne saute jamais la suivante. Aucune clé
        de modèle ne doit apparaître ailleurs que côté serveur, et jamais dans
        `envPrefix`. Le service LLM ne doit jamais renvoyer d'erreur tant qu'un
        autre modèle peut répondre : vérifie que tout échec de quota bascule sur
        le candidat suivant. Les modèles se déclarent en variables
        d'environnement, jamais en dur. Le budget total doit rester sous le
        `maxDuration` de vercel.json.
    - path: 'packages/shared/**'
      instructions: >-
        Code consommé par le site ET le Studio. Aucune dépendance à React, Sanity
        ou au DOM n'est acceptable ici. Toute valeur dupliquée entre apps/web et
        apps/studio devrait remonter dans ce paquet.

chat:
  auto_reply: true
